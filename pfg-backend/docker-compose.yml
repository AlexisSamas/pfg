services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://pfg_user:pfg_password@postgres:5432/pfg_db
      REDIS_URL: redis://redis:6379/0
      ENABLE_REDIS: "true"
      SECRET_KEY: development-secret-key-32-chars-long-or-more-change-me
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DEFAULT_ATTENTION_THRESHOLD: 60.0
      DEFAULT_WAIT_MINUTES: 10
      MAX_ATTEMPTS: 3
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pfg_db
      POSTGRES_USER: pfg_user
      POSTGRES_PASSWORD: pfg_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
